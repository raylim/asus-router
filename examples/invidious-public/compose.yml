services:
  proxy:
    image: caddy:2-alpine@sha256:8652f54d3ef21e120f78f3c6b396bcf7d3fc8f999cece30cd35490430da89430
    container_name: invidious-public-proxy
    restart: unless-stopped
    environment:
      PUBLIC_IPV4: ${PUBLIC_IPV4}
    ports:
      - "0.0.0.0:8443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - invidious
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  invidious:
    external: true
    name: invidious_default
volumes:
  caddy_data:
  caddy_config:
